          - generic [ref=e297]: 好勒。 面试官您好，我叫董欣，然后本科就读于中国人民大学，硕士就读于北京师范大学，是27届毕业的硕士生，然后此前主要是有4段实习，第一段是在boss直聘做的行业和产品研究，然后这段时期主要是根据业务的目标，对指定的行业和职位进行针对性的知识库的扩充，赠品分析以及一些APP端的优化。 然后第二段是在国务院发展研究中心的大数据研究院做的产品经理，然后这一段产品是一个to g的大数据平台，一个可视化的平台，然后一方面是在已有的平台场景上会进行一些增添修改功能上的改动等等，另一方面是会参与到新的场景的一些规划构建。 第三段实习是在美团做的数据运营，然后平常工作一方面是数据方面的一些工作，比如说日常的一些日日复盘周复盘以及数据看板的一个搭建，然后另一方面也会对接一些组内的需求，去优化一些一线人员他们使用的一些系统，然后最近一段实习是在科大讯飞做的一些产品，然后这个产品是一个是一个医疗场景下的多模态的智能体系统，然后我主要做的工作就是这个产品目前是在从0~1的阶段，然后主要工作一方面是参与到这个产品的构建迭代，然后另一方面也会去合作的医院去那边去去做运营，然后推动那边的常态化运营，然后促进促使促进他们去使用系统。 然后回公司之后可以利用医院那边的运营数据去进一步的去对这个系统进行进一步的去优化，提升产品效果。 然后此外也会做一些用AI一些提效的事情，比如说在云数据分析的过程中去搭建工作流，然后也有为业务线去设计一个原产品产品文档转圆形的一个skew去提升整个业务工作效率等等。然后因为我本身对于AI和产品都比较感兴趣，所以说现在就正在寻找一个AI产品方向的岗位，谢谢。
